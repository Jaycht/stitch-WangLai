name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 CLI 要求 Node >= 22.0.0，
          # 用20 会直接报 "The Capacitor CLI requires NodeJS >=22.0.0"
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Sync version from src/version.ts
        # ★ v2.14.9：以前 APK 名里的版本号取自 android/app/build.gradle 的
        #   versionName，而那个字段是**手工**维护的 —— 页面已经到 2.14.8，
        #   它却还停在 2.14.1，于是导出「往来礼记-v2.14.1-正式版.apk」。
        #   现在把 **src/version.ts 当作唯一事实源**：CI 读它，写回
        #   build.gradle 的 versionName / versionCode，三处（关于页、
        #   APK 内部版本、文件名）从此不可能再对不上。
        run: |
          VER=$(grep -oE "VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" src/version.ts \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$VER" ]; then
            echo "::error::无法从 src/version.ts 读出 VERSION，请检查该文件格式"
            exit 1
          fi
          IFS=. read -r MA MI PA <<< "$VER"
          CODE=$((MA * 10000 + MI * 100 + PA))
          echo "读到版本 $VER（versionCode $CODE）"
          sed -i -E "s/versionCode [0-9]+/versionCode ${CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VER}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
          echo "VER=${VER}" >> $GITHUB_ENV

      - name: Build web app
        run: npm run build

      - name: Sync to Android
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # 必须是 21：@capacitor/android 8.x 的 build.gradle 里写死了
          # sourceCompatibility/targetCompatibility = JavaVersion.VERSION_21，
          # 用 17 会报 "error: invalid source release: 21"
          java-version: '21'

      - name: Check signing files
        # 没密钥就只出 debug 包，保证 workflow 不会莫名失败
        run: |
          if [ -f android/keystore.properties ] && [ -f android/wanglai-release.p12 ]; then
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
            echo "使用正式签名构建"
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
            echo "警告：未找到签名文件，本次只出测试包（debug）"
          fi

      - name: Cache Gradle
        # Android 构建要拉 200MB+ 依赖，缓存后每次构建省 3~5 分钟
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        # Windows 提交的文件没有 Unix 执行位，
        # 在 Linux runner 上会报 "./gradlew: Permission denied"
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Collect APKs
        run: |
          # 版本号用上一步从 src/version.ts 读出来、写进 $GITHUB_ENV 的 $VER，
          # 不再现从 build.gradle 里 grep（那样等于又开了一个事实源）。
          if [ -z "$VER" ]; then
            echo "::error::没有拿到 VER，版本号同步步骤可能失败了"
            exit 1
          fi
          echo "APK 将命名为 往来礼记-v${VER}-*.apk"
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "apk-out/往来礼记-v${VER}-测试版.apk"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
               "apk-out/往来礼记-v${VER}-正式版.apk"
          fi
          ls -la apk-out/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: 往来礼记-APK
          path: apk-out/*.apk
          if-no-files-found: error